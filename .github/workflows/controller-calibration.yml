name: Controller calibration evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    name: Frozen fit and certificate recomputation
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -e '.[dev]'
      - name: Check calibration timing and certificate boundaries
        run: python -m pytest --strict-ci -q tests/test_calibration_trace.py tests/test_controller_certificate.py tests/test_controller_calibration_audit.py
      - name: Refit all published partitions and recompute the declared certificate
        run: python tools/verify_controller_calibration.py evidence/controller-calibration --output runs/controller-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: controller-calibration-audit
          path: runs/controller-audit.json
          if-no-files-found: error
          retention-days: 30
