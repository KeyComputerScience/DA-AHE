name: Repair uploaded evidence paths
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply validated bundle and check source manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile
          bundle = Path('DA-AHE-fix-evidence-paths.zip')
          expected = '6f5fe96df277bd309359036080f0910c615f686490ea1fdc1ec52c688b653a11'
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == expected
          with ZipFile(bundle) as archive:
              assert len(archive.infolist()) == 244
              for item in archive.infolist():
                  path = Path(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not item.is_dir()
                  archive.extract(item, '.')
                  os.chmod(path, (item.external_attr >> 16) & 0o777)
          records = json.loads(Path('manifest.json').read_text())['files']
          assert len(records) == 121
          for item in records:
              path = Path(item['path'])
              assert path.is_file(), item['path']
              assert path.stat().st_size == item['size'], item['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256'], item['path']
          config = json.loads(Path('simulation/config.json').read_text())
          for item in config['bound_evidence_artifacts'].values():
              path = Path(item['path'])
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256'], str(path)
          print(json.dumps({'source_manifest_checked_files': len(records), 'errors': [], 'bound_evidence_paths_verified': True}))
          PY
      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/independent .dockerignore .gitattributes .gitignore .github/workflows/reproduce.yml SHA256SUMS.txt DELIVERABLE_SHA256SUMS.txt
          git rm DA-AHE-fix-evidence-paths.zip
          git diff --cached --check
          git commit -m 'Restore expected evidence paths and source integrity files'
          git push origin HEAD:main
