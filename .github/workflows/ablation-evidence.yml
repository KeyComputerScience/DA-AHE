name: Ablation evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    name: Archived rank-6 ablation statistics and figures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned statistical, plotting and test dependencies
        run: python -m pip install -e '.[dev,evaluation]'
      - name: Check ablation statistics and network accounting
        run: |
          python tools/run_logged.py --output runs/ablation-tests -- \
            python -m pytest --strict-ci -q \
            tests/test_ablation_analysis.py tests/test_ablation_instrumentation.py \
            tests/test_performance_export.py \
            tests/test_simulation_network.py tests/test_simulation_rosters.py
      - name: Export the archived paired rank-6 records
        run: |
          python tools/run_logged.py --output runs/ablation-export-command -- \
            python tools/export_ablation_evaluation.py \
            evidence/independent/campaign-report \
            --output runs/ablation-evidence --figures \
            --expected-seeds 20 \
            --bootstrap-resamples 100000 --bootstrap-seed 20261017
      - name: Require complete generated artifacts and preserve archived inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('runs/ablation-evidence')
          names = ('ablation-summary.json', 'ablation-statistics.csv',
                   'ablation-per-seed.csv', 'ablation-bars.pdf',
                   'ablation-caption.tex', 'ablation-caption.txt', 'export-manifest.json')
          for name in names:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError('Missing or empty ablation artifact: ' + name)
          PY
          git diff --exit-code -- evidence/independent/campaign-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: independent-ablation-evidence
          path: |
            runs/ablation-evidence/
            runs/ablation-tests/
            runs/ablation-export-command/
          if-no-files-found: error
          retention-days: 30
