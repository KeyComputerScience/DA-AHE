name: Independent reproduction
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      campaign:
        description: Run the complete independent 20-seed campaign
        type: boolean
        default: false
      security:
        description: Run the pinned heuristic lattice attack estimates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,pq]'
      - name: Build pinned ML-DSA provider
        run: |
          git clone https://github.com/open-quantum-safe/liboqs.git external/liboqs
          git -C external/liboqs checkout --detach 5a1a854b0dc9f2141bdc771c555ee60c37950183
          cmake -S external/liboqs -B build/liboqs -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_MINIMAL_BUILD=SIG_ml_dsa_44 -DOQS_USE_OPENSSL=OFF -DCMAKE_INSTALL_PREFIX="$PWD/external/oqs-install"
          cmake --build build/liboqs --parallel 2
          cmake --install build/liboqs
          echo "OQS_INSTALL_PATH=$PWD/external/oqs-install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/external/oqs-install/lib:$PWD/external/oqs-install/lib64" >> "$GITHUB_ENV"
      - name: Run real tests and preserve execution receipts
        run: |
          python tools/run_logged.py --output runs/validation/tests -- python -m pytest -q
          python tools/run_logged.py --output runs/validation/pq -- python -m pytest -q -m pq
          python tools/run_logged.py --output runs/validation/protocol -- python tools/run_protocol_trials.py --trials 3 --output runs/protocol
          python tools/run_logged.py --output runs/validation/native-configure -- cmake -S embedded -B build/embedded -DDAAHE_MODULE_RANK=6
          python tools/run_logged.py --output runs/validation/native-build -- cmake --build build/embedded
          python tools/run_logged.py --output runs/validation/native-test -- ctest --test-dir build/embedded --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: independent-functional-evidence
          path: runs/
          retention-days: 30
  campaign:
    if: github.event_name == 'workflow_dispatch' && inputs.campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/run_logged.py --timeout 10000 --output runs/campaign-execution -- python tools/run_simulation_campaign.py --config simulation/config.json --output runs/simulation
      - run: python tools/verify_simulation_campaign.py runs/simulation
      - run: python tools/independent_manifest.py build --root runs
      - run: python tools/independent_manifest.py verify --root runs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-20-seed-evidence
          path: runs/
          retention-days: 30
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - run: python firmware/build.py --cc arm-none-eabi-gcc --module-rank 6 --output runs/firmware
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-firmware-build
          path: runs/firmware/
          retention-days: 30
  security:
    if: github.event_name == 'workflow_dispatch' && inputs.security
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:10.6
      options: --user root
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run pinned estimates; retain incomplete and below-floor outcomes
        run: |
          git clone https://github.com/malb/lattice-estimator.git external/lattice-estimator
          git -C external/lattice-estimator checkout --detach 53da5982597709ba0fdf94ea37a84d822310fd84
          sage -python tools/estimate_security_parameters.py --estimator external/lattice-estimator --output runs/security --module-rank 6 --attack-timeout 600 --minimum-bits 128.1
          sage -python security/verify_run.py runs/security --upstream external/lattice-estimator --minimum-bits 128.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-security-estimates
          path: runs/security/
          retention-days: 30
