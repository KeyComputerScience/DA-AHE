name: Independent reproduction

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every listed job runs for every trigger. A passing aggregate requires all jobs,
# including the historical raw-data audit and new full campaign/attack estimates.
# This workflow verifies the independent implementation under its declared models;
# it cannot supply absent original-author records or physical board measurements.
jobs:
  source:
    name: Source bytes and evidence index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify source manifest
        run: python tools/run_logged.py --output runs/source -- python -m daahe verify-manifest manifest.json --root .
      - name: Enforce the original-paper and physical-measurement evidence scope
        run: python tools/check_ci_coverage.py --validate-claims-only --output runs/claim-scope.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: independent-source-verification
          path: runs/
          if-no-files-found: error
          retention-days: 30

  functional:
    name: Real ML-DSA protocol and native C tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,pq]'
      - name: Build pinned ML-DSA provider
        run: |
          git clone https://github.com/open-quantum-safe/liboqs.git external/liboqs
          git -C external/liboqs checkout --detach 5a1a854b0dc9f2141bdc771c555ee60c37950183
          cmake -S external/liboqs -B build/liboqs -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_MINIMAL_BUILD=SIG_ml_dsa_44 -DOQS_USE_OPENSSL=OFF -DCMAKE_INSTALL_PREFIX="$PWD/external/oqs-install"
          cmake --build build/liboqs --parallel 2
          cmake --install build/liboqs
          echo "OQS_INSTALL_PATH=$PWD/external/oqs-install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/external/oqs-install/lib:$PWD/external/oqs-install/lib64" >> "$GITHUB_ENV"
      - name: Run host tests and real cryptographic trials
        run: |
          python tools/run_logged.py --output runs/validation/tests -- python -m pytest -q -m 'not pq' --ignore=tests/test_decoding_bound_interval.py
          python tools/run_logged.py --output runs/validation/pq -- python -m pytest -q -m pq
          python tools/run_logged.py --output runs/validation/protocol -- python tools/run_protocol_trials.py --trials 3 --module-rank 6 --output runs/protocol
      - name: Build and test native C core
        run: |
          python tools/run_logged.py --output runs/validation/native-configure -- cmake -S embedded -B build/embedded -DDAAHE_MODULE_RANK=6
          python tools/run_logged.py --output runs/validation/native-build -- cmake --build build/embedded --parallel 2
          python tools/run_logged.py --output runs/validation/native-test -- ctest --test-dir build/embedded --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-functional-evidence
          path: runs/
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: ARM microbenchmark build (no board measurements)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - run: python tools/run_logged.py --output runs/validation/firmware -- python firmware/build.py --cc arm-none-eabi-gcc --module-rank 6 --output runs/firmware
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-firmware-build
          path: runs/
          if-no-files-found: error
          retention-days: 30

  replay:
    name: New small campaign and deterministic replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Execute all seven methods on two audit seeds
        run: python tools/run_logged.py --output runs/execution -- python tools/run_simulation_campaign.py --config simulation/config.json --nodes 30 --seeds 61,62 --jobs 2 --output runs/simulation
      - name: Recompute raw metrics and replay every case
        run: python tools/run_logged.py --output runs/verification -- python tools/verify_simulation_campaign.py runs/simulation --jobs 2 --replay
      - run: python tools/independent_manifest.py build --root runs
      - run: python tools/independent_manifest.py verify --root runs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-small-campaign-replay
          path: runs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  history:
    name: Published historical 20-seed raw evidence (140 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      # A checksum without downloadable bytes is insufficient. This step fails
      # on a missing part, altered checksum, incomplete archive or raw-data gap.
      - name: Download and verify the pinned complete historical archive
        run: python tools/run_logged.py --timeout 10000 --output runs/history-execution -- python tools/verify_published_evidence.py --extract-dir runs/history --recompute --replay --jobs 2 --report runs/history-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-historical-verification
          # The immutable public release already hosts the large input bytes.
          # Upload the new verification receipt, not another multi-GB copy.
          path: |
            runs/history-execution/
            runs/history-verification.json
          if-no-files-found: error
          retention-days: 30

  campaign:
    name: Fresh full 20-seed campaign (140 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Execute configured 20 seeds and all seven methods
        run: python tools/run_logged.py --timeout 10000 --output runs/campaign-execution -- python tools/run_simulation_campaign.py --config simulation/config.json --jobs 2 --output runs/simulation
      - name: Recompute every raw result and replay all 140 cases
        run: python tools/run_logged.py --timeout 12000 --output runs/campaign-verification -- python tools/verify_simulation_campaign.py runs/simulation --jobs 2 --replay
      - run: python tools/independent_manifest.py build --root runs
      - run: python tools/independent_manifest.py verify --root runs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-new-20-seed-evidence
          path: runs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  security:
    name: Seven fresh pinned attack estimates and decoding bounds
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:10.6@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb
      options: --user root
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install the runtime Git client and certificate roots
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select a verified Sage-enabled interpreter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/environment
          selected=''
          for candidate in 'python' 'sage --python' 'sage -python'; do
            if $candidate -c 'from sage.all import RealIntervalField; from sage.env import SAGE_VERSION; print(SAGE_VERSION)' > runs/environment/sage-probe.txt 2>&1; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          printf '#!/bin/sh\nexec %s "$@"\n' "$selected" > /usr/local/bin/daahe-sage-python
          chmod +x /usr/local/bin/daahe-sage-python
          # Preserve Sage's compiled numeric dependency stack. These scripts
          # need pytest and the package path, not a replacement Sage NumPy.
          daahe-sage-python -m pip install pytest==8.3.5
          echo "PYTHONPATH=$PWD/src" >> "$GITHUB_ENV"
          daahe-sage-python -c 'import json, platform, sys; from sage.env import SAGE_VERSION; print(json.dumps({"python":sys.version,"executable":sys.executable,"sage":SAGE_VERSION,"platform":platform.platform()},indent=2))' > runs/environment/runtime.json
          daahe-sage-python -m pip freeze > runs/environment/pip-freeze.txt
      - name: Fetch the exact upstream attack implementation
        shell: bash
        run: |
          git clone https://github.com/malb/lattice-estimator.git external/lattice-estimator
          git -C external/lattice-estimator checkout --detach 53da5982597709ba0fdf94ea37a84d822310fd84
      - name: Verify the preserved seven-attack result and source bytes
        run: daahe-sage-python tools/run_logged.py --output runs/security-saved-verification -- daahe-sage-python security/verify_run.py evidence/independent/security-parameter-search/selected-k6-full --upstream external/lattice-estimator --minimum-bits 128.1
      - name: Verify preserved exact-CDT record and rational bounds
        run: daahe-sage-python tools/run_logged.py --output runs/decoding-saved-verification -- daahe-sage-python tools/verify_decoding_record.py evidence/independent/decoding/k6-cdt-03
      - name: Execute all seven attacks for the selected rank-six parameters
        run: daahe-sage-python tools/run_logged.py --timeout 6600 --output runs/security-execution -- daahe-sage-python tools/estimate_security_parameters.py --estimator external/lattice-estimator --output runs/security --module-rank 6 --attack-timeout 900 --minimum-bits 128.1
      - name: Independently verify the fresh attack logs and minimum
        run: daahe-sage-python tools/run_logged.py --output runs/security-verification -- daahe-sage-python security/verify_run.py runs/security --upstream external/lattice-estimator --minimum-bits 128.1
      - name: Run Sage interval and exact finite-sampler tests
        run: daahe-sage-python tools/run_logged.py --output runs/decoding-tests -- daahe-sage-python -m pytest -q tests/test_decoding_bound_reference.py tests/test_decoding_bound_interval.py
      - name: Recompute exact-CDT outward interval decoding bounds
        run: daahe-sage-python tools/run_logged.py --output runs/decoding-execution -- daahe-sage-python tools/certify_decoding_bound.py --output runs/decoding --module-rank 6 --precision 256 --target-bits 128 --security-report runs/security/security.json
      - run: daahe-sage-python tools/independent_manifest.py build --root runs
      - run: daahe-sage-python tools/independent_manifest.py verify --root runs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-security-and-decoding-evidence
          path: runs/
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: All independent reproduction checks passed
    if: always()
    needs: [source, functional, firmware, replay, history, campaign, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject missing, skipped, failed or cancelled coverage
        env:
          DAAHE_CI_RESULTS: ${{ toJSON(needs) }}
        run: python tools/check_ci_coverage.py --output runs/coverage.json
      - name: Write the truthful verification scope
        if: always()
        run: |
          cat runs/coverage.json >> "$GITHUB_STEP_SUMMARY"
          printf '\nThis run checks the independent implementation and recorded synthetic experiments. Original-paper reproduction, physical-board measurements and full-system certification remain unestablished.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-complete-ci-coverage
          path: runs/coverage.json
          if-no-files-found: error
          retention-days: 30
