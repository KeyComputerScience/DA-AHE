name: Diagnose macOS frozen replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.2.4
      - name: Verify and extract the exact compact frozen-source probe
        run: |
          python - <<'PYPROBE'
          import base64, hashlib, pathlib, zipfile
          encoded=pathlib.Path('diagnostics/historical-replay-probe-seed1004.base64').read_bytes()
          p=pathlib.Path('runs/probe-input.zip')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(base64.b64decode(b''.join(encoded.split()),validate=True))
          expected='765b0284503967cf5dcdcbb16bbbc393feabef1ecedc287269040189b29c4df2'
          if hashlib.sha256(p.read_bytes()).hexdigest()!=expected:
              raise ValueError('compact probe ZIP checksum mismatch')
          out=pathlib.Path('runs/probe')
          out.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  path=pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '\\' in name:
                      raise ValueError('unsafe compact probe ZIP path')
              z.extractall(out)
          PYPROBE
      - name: Run exact frozen case and preserve diagnostics without tolerance
        run: python tools/run_logged.py --timeout 1200 --output runs/diagnosis-execution -- python runs/probe/probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-frozen-replay-seed1004-da-ahe-diagnosis
          path: |
            runs/probe/diagnostic.json
            runs/probe/replayed/epochs.jsonl.gz
            runs/probe/reference-epochs.jsonl.gz
            runs/probe/identity.json
            runs/probe/probe.py
            runs/diagnosis-execution/
          if-no-files-found: error
          retention-days: 30
