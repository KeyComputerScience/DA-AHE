name: Preserve completed independent CI receipts
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a7c7ee5124646c0ab1aed2be3cf36490cc48ce8c
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify completed CI and preserve actual execution records
        run: |
          python - <<'PYCODE'
          import datetime, hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          
          REPO = 'KeyComputerScience/DA-AHE'
          RUN = 38730701838
          HEAD = 'a7c7ee5124646c0ab1aed2be3cf36490cc48ce8c'
          TREE = '4fb270dc2b38c158dc671bcf5a80686b1fe1b3e8'
          RELEASE = 'independent-evidence-2026-10-15'
          
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + REPO + '/' + endpoint], text=True))
          def load(path):
              return json.loads(path.read_text())
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
              return h.hexdigest()
          def put(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n')
          
          run=api(f'actions/runs/{RUN}')
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==HEAD
          assert api('git/commits/'+HEAD)['tree']['sha']==TREE
          jobs=api(f'actions/runs/{RUN}/jobs?per_page=100')
          assert len(jobs['jobs'])==9 and all(j['conclusion']=='success' for j in jobs['jobs'])
          artifacts=api(f'actions/runs/{RUN}/artifacts?per_page=100')
          expected={'independent-source-verification':'source','independent-functional-evidence':'functional',
          'independent-firmware-build':'firmware','independent-small-campaign-replay':'small',
          'independent-historical-verification':'history','independent-historical-linux-raw-verification':'history-linux',
          'independent-new-20-seed-evidence':'fresh','independent-security-and-decoding-evidence':'security',
          'independent-complete-ci-coverage':'coverage'}
          assert set(expected)=={a['name'] for a in artifacts['artifacts']}
          assert all(not a['expired'] for a in artifacts['artifacts'])
          base=Path(os.environ['RUNNER_TEMP'])/'complete-ci-receipt';base.mkdir()
          cache=base/'download';out=base/'DA-AHE-CI-a7c7ee5-verification';out.mkdir()
          for name,short in expected.items():
              subprocess.run(['gh','run','download',str(RUN),'--repo',REPO,'--name',name,'--dir',str(cache/short)],check=True)
          for short in ('fresh','security','small'):
              subprocess.run([sys.executable,'tools/independent_manifest.py','verify','--root',str(cache/short)],check=True)
          cov=load(cache/'coverage/coverage.json')
          assert cov['status']=='passed_all_independent_ci_checks'
          assert set(cov['required_jobs'])=={'source','functional','firmware','replay','history','history_linux','campaign','security'}
          assert all(v=='success' for v in cov['job_results'].values()) and not cov['paper_reproduced'] and not cov['all_manuscript_metrics_verified']
          history=load(cache/'history/history-verification.json');linux=load(cache/'history-linux/history-linux-verification.json')
          for record in (history,linux):
              assert record['archive_sha256']=='079aa14358b83d5cf6e132b2c4b653ac2937feeae217c6c6965e1369cff511c0'
              assert record['archive_verified'] and record['listed_evidence_files_verified']==1193
              assert record['campaign_runs']==140 and record['raw_recomputation']['verified_runs']==140
              assert record['raw_recomputation']['independent_raw_recomputation'] and not record['paper_reproduced']
          replay=history['frozen_source_replay']
          assert replay['verified_runs']==140 and replay['deterministic_replay'] and len(replay['runs'])==140
          assert all(r['passed'] and r['raw_files']==4 for r in replay['runs'])
          fresh=cache/'fresh';campaign=load(fresh/'simulation/manifest.json')
          verified=load(fresh/'campaign-verification/stdout.log')
          assert verified['verified_runs']==140 and verified['independent_raw_recomputation'] and verified['deterministic_replay']
          assert campaign['completed'] and len(campaign['runs'])==140 and campaign['source_digest']==verified['source_digest']
          assert set(campaign['evaluation_seeds'] if 'evaluation_seeds' in campaign else load(fresh/'simulation/config.json')['evaluation_seeds'])==set(range(1000,1020))
          for rel,h in campaign['source_hashes'].items():
              assert sha(Path(rel))==h and sha(fresh/'simulation/source'/rel)==h
          for short in ('source','functional','firmware','small','history','history-linux','security','coverage'):
              shutil.copytree(cache/short,out/short)
          for rel in ('campaign-execution','campaign-verification','manifest.json','simulation/source',
                      'simulation/manifest.json','simulation/summary.json','simulation/bound_artifacts',
                      'simulation/config.json','simulation/controller.json'):
              src=fresh/rel;dst=out/'fresh'/rel;dst.parent.mkdir(parents=True,exist_ok=True)
              if src.is_dir():shutil.copytree(src,dst)
              else:shutil.copy2(src,dst)
          (out/'fresh/manifest.json').rename(out/'fresh/full-artifact-manifest.json')
          for row in campaign['runs']:
              for name in ('manifest.json','summary.json'):
                  src=fresh/'simulation'/row['directory']/name
                  dst=out/'fresh/simulation'/row['directory']/name;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
          put(out/'workflow-run.json',run);put(out/'workflow-jobs.json',jobs);put(out/'workflow-artifacts.json',artifacts)
          put(out/'receipt-index.json',{'origin':'independent_reimplementation','paper_reproduced':False,
          'all_manuscript_metrics_verified':False,'physical_board_samples':0,'ci_run':RUN,'head_sha':HEAD,'tree_sha':TREE,
          'all_nine_jobs_success':True,'historical_runs_raw_recomputed_on_linux':140,'historical_runs_exactly_replayed_on_macos':140,
          'historical_raw_log_sha256_comparisons':560,'fresh_runs_generated':140,'fresh_runs_raw_recomputed':140,
          'fresh_runs_exactly_replayed':140,'fresh_source_files_matched_checkout':len(campaign['source_hashes']),
          'fresh_full_artifact_manifest_verified':True,'fresh_full_artifact_files_verified':len(load(fresh/'manifest.json')['files']),'fresh_raw_logs_included':False,
          'fresh_metadata_extract_only':True,'fresh_raw_artifact_retention_days':30,
          'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          'scope':'Independent executable checks and synthetic models only. Complete historical raw logs remain in the four immutable release parts. Fresh CI raw logs were fully checksummed before selecting these receipts; this ZIP is not a replacement for a full raw archive.'})
          (out/'README.txt').write_text('Completed independent CI verification receipts, main a7c7ee5.\nAll nine jobs actually succeeded; see workflow-jobs.json and coverage/coverage.json.\nHistorical raw evidence: four original parts in this same release, unchanged.\nFresh 140-run records here are a METADATA EXTRACT, not the complete raw logs. The full fresh artifact was checked before extraction; its GitHub retention is 30 days.\nNo original-paper or physical-board reproduction is claimed.\n')
          subprocess.run([sys.executable,'tools/independent_manifest.py','build','--root',str(out)],check=True)
          subprocess.run([sys.executable,'tools/independent_manifest.py','verify','--root',str(out)],check=True)
          archive=Path(shutil.make_archive(str(out),'zip',root_dir=out))
          subprocess.run(['gh','release','upload',RELEASE,str(archive),'--repo',REPO],check=True)
          release=api('releases/tags/'+RELEASE)
          assets=[a for a in release['assets'] if a['name']==archive.name];assert len(assets)==1
          asset=assets[0];assert asset['size']==archive.stat().st_size and asset['digest']=='sha256:'+sha(archive)
          proof={'asset_id':asset['id'],'asset_name':asset['name'],'size':asset['size'],'sha256':sha(archive),'browser_download_url':asset['browser_download_url'],'ci_run':RUN,'head_sha':HEAD,'tree_sha':TREE,'paper_reproduced':False}
          put(Path('release-receipt.json'),proof);print(json.dumps(proof,indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: durable-ci-receipt-publication
          path: release-receipt.json
          if-no-files-found: warn
          retention-days: 30
